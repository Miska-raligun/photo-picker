[package]
name         = "photo-pick"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[[bin]]
name = "photo-pick"
path = "src/main.rs"

[features]
# Default builds carry the ONNX models. `--no-default-features` builds a
# pHash-only binary without linking onnxruntime — same bridge as the server
# crate, mainly so environments without the static lib can still type-check.
default = ["onnx"]
onnx = ["photo-pick-core/onnx"]

[dependencies]
photo-pick-core    = { path = "../core", default-features = false }
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif          = { workspace = true }
rayon              = { workspace = true }
