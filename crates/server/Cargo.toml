[package]
name         = "photo-pick-server"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[[bin]]
name = "photo-pick-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Default builds carry the ONNX models (CLIP + YuNet). `--no-default-features`
# builds the full HTTP surface without linking onnxruntime — scans degrade to
# pHash-only, but every non-inference endpoint (browse/apply/export/…) works.
# That is also what lets the handler integration tests compile + run in
# environments without the static lib.
default = ["onnx"]
onnx = ["photo-pick-core/onnx"]
# Like `onnx`, but ort downloads a prebuilt onnxruntime static lib for the
# build target (CI cross-platform builds) instead of using the vendored one.
onnx-download = ["onnx", "photo-pick-core/onnx-download"]

[dependencies]
photo-pick-core    = { path = "../core", default-features = false }
axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }
anyhow             = { workspace = true }
dirs               = { workspace = true }
trash              = { workspace = true }
rust-embed         = { workspace = true }
mime_guess         = { workspace = true }
tokio-stream       = { workspace = true }
futures-util       = { workspace = true }
chrono             = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower    = { workspace = true, features = ["util"] }
http-body-util = "0.1"
